---
deployment:
  tasks:
    # Layihə:   $HOME/xaliqrzayev.com/  (app, config, templates, storage — veb-dən kənarda)
    # Sayt:     $HOME/public_html/      (yalnız public/ qovluğunun məzmunu)
    # Toxunulmur: config/config.php, storage/*, public/assets/img/uploads/*
    - export APPPATH=$HOME/xaliqrzayev.com/
    - export WEBPATH=$HOME/public_html/
    - /bin/mkdir -p $APPPATH $WEBPATH
    - /bin/rsync -a --delete --exclude='config/config.php' --exclude='storage/' app config templates $APPPATH
    - /bin/mkdir -p ${APPPATH}storage
    - /bin/cp -n storage/.htaccess ${APPPATH}storage/.htaccess
    - /bin/rsync -a --exclude='assets/img/uploads/*' public/ $WEBPATH
